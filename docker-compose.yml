services:
        mica:
                image: obiba/mica:snapshot
                ports:
                        - "8882:8082"
                depends_on:
                        mongo:
                                condition: service_healthy
                        es8:
                                condition: service_started
                        agate:
                                condition: service_started
                        opal:
                                condition: service_started
                environment:
                        - JAVA_OPTS=-Xmx2G
                        - MICA_ADMINISTRATOR_PASSWORD=password
                        - MICA_ANONYMOUS_PASSWORD=password
                        - MONGO_HOST=mongo
                        - MONGO_PORT=27017
                        - MONGO_DB=mica
                        - MONGO_USER=${MONGO_USER:-obiba}
                        - MONGO_PASSWORD=${MONGO_PASSWORD:-password}
                        - OPAL_URL=http://opal:8080
                        - AGATE_URL=http://agate:8081
                        - ELASTICSEARCH_HOST=es8
                volumes:
                        - /tmp/mica:/srv
        mongo:
                image: mongo:8
                environment:
                        - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-obiba}
                        - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
                healthcheck:
                        test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin --quiet -u ${MONGO_USER:-obiba} -p ${MONGO_PASSWORD:-password} --authenticationDatabase admin
                        interval: 5s
                        timeout: 5s
                        retries: 20
                        start_period: 30s
        opal:
                image: obiba/opal
                ports:
                        - "8880:8080"
                depends_on:
                        mongo:
                                condition: service_healthy
                        rock:
                                condition: service_started
                environment:
                        - OPAL_ADMINISTRATOR_PASSWORD=password
                        - MONGO_HOST=mongo
                        - MONGO_PORT=27017
                        - MONGO_USER=${MONGO_USER:-obiba}
                        - MONGO_PASSWORD=${MONGO_PASSWORD:-password}
                        - MONGODATA_DATABASE=opal
                        - AGATE_URL=http://agate:8081
                        - ROCK_HOSTS=rock:8085
                volumes:
                        - /tmp/opal:/srv
        agate:
                image: obiba/agate
                ports:
                        - "8881:8081"
                depends_on:
                        mongo:
                                condition: service_healthy
                environment:
                        - AGATE_ADMINISTRATOR_PASSWORD=password
                        - MONGO_HOST=mongo
                        - MONGO_PORT=27017
                        - MONGO_DB=agate
                        - MONGO_USER=${MONGO_USER:-obiba}
                        - MONGO_PASSWORD=${MONGO_PASSWORD:-password}
                        - RECAPTCHA_SITE_KEY=6Lfo7gYTAAAAAOyl8_MHuH-AVBzRDtpIuJrjL3Pb
                        - RECAPTCHA_SECRET_KEY=6Lfo7gYTAAAAADym-vSDvPBeBCXaxIprA0QXLk_b
                volumes:
                        - /tmp/agate:/srv
        rock:
                image: obiba/rock
        es8:
                #image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION}
                image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
                expose:
                        - 9300
                        - 9200
                environment:
                        - cluster.name=mica
                        - node.name=es8
                        - discovery.type=single-node
                        - bootstrap.memory_lock=true
                        - network.host=0.0.0.0
                        - xpack.security.enabled=false
                        - xpack.security.http.ssl.enabled=false
                        - ES_JAVA_OPTS=-Xms512m -Xmx512m
                ulimits:
                        memlock:
                                soft: -1
                                hard: -1
